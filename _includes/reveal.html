<script src="{{ 'assets/dist/reveal.js' | relative_url }}"></script>
<script src="{{ 'assets/dist/plugin/markdown.js' | relative_url }}"></script>
<script src="{{ 'assets/dist/plugin/highlight.js' | relative_url }}"></script>
<script src="{{ 'assets/dist/plugin/search.js' | relative_url }}"></script>
<script src="{{ 'assets/dist/plugin/zoom.js' | relative_url }}"></script>
<script src="{{ 'assets/dist/plugin/notes.js' | relative_url }}"></script>
<script src="{{ 'assets/dist/plugin/math.js' | relative_url }}"></script>
<script>
  // https://revealjs.com/config/
  Reveal.initialize({
    // Presentation size and scaling
    width: {{ site.reveal.width | default: 960 }},
    height: {{ site.reveal.height | default: 700 }},
    margin: {{ site.reveal.margin | default: 0.04 }},
    minScale: {{ site.reveal.minScale | default: 0.2 }},
    maxScale: {{ site.reveal.maxScale | default: 2.0 }},

    // Display presentation control arrows
    controls: {{ site.reveal.controls | default: true }},

    // Determines where controls appear, "edges" or "bottom-right"
    controlsLayout: '{{ site.reveal.controlsLayout | default: "bottom-right" }}',

    // Visibility rule for backwards navigation arrows; "faded", "hidden" or "visible"
    controlsBackArrows: '{{ site.reveal.controlsBackArrows | default: "faded" }}',

    // Display a presentation progress bar
    progress: {{ site.reveal.progress | default: true }},

    // Display the page number of the current slide
    slideNumber: {% if site.reveal.number %}'{{ site.reveal.numberType | default: "c" }}'{% else %}false{% endif %},

    // Contexts in which the slide number appears; "all", "print" or "speaker"
    showSlideNumber: '{{ site.reveal.showSlideNumber | default: "all" }}',

    // Add the current slide to the URL hash and browser history
    hash: {{ site.reveal.hash | default: true }},
    history: {{ site.reveal.history | default: false }},
    jumpToSlide: {{ site.reveal.jumpToSlide | default: true }},

    // Enable keyboard, touch and overview navigation
    keyboard: {{ site.reveal.keyboard | default: true }},
    touch: {{ site.reveal.touch | default: true }},
    overview: {{ site.reveal.overview | default: true }},
    disableLayout: {{ site.reveal.disableLayout | default: false }},

    // Vertical centering of slides
    center: {{ site.reveal.center | default: true }},

    // Loop, right-to-left and shuffle the presentation
    loop: {{ site.reveal.loop | default: false }},
    rtl: {{ site.reveal.rtl | default: false }},
    shuffle: {{ site.reveal.shuffle | default: false }},

    // Turn fragments on/off globally and show the built-in help overlay ("?")
    fragments: {{ site.reveal.fragments | default: true }},
    fragmentInURL: {{ site.reveal.fragmentInURL | default: true }},
    help: {{ site.reveal.help | default: true }},

    // Auto-animate matching elements between slides
    autoAnimate: {{ site.reveal.autoAnimate | default: true }},
    autoAnimateEasing: '{{ site.reveal.autoAnimateEasing | default: "ease" }}',
    autoAnimateDuration: {{ site.reveal.autoAnimateDuration | default: 1.0 }},

    // Auto-advance slides (0 disables)
    autoSlide: {{ site.reveal.autoSlide | default: 0 }},
    autoSlideStoppable: {{ site.reveal.autoSlideStoppable | default: true }},

    // Global transition; none/fade/slide/convex/concave/zoom
    transition: '{{ site.reveal.transition | default: "slide" }}',
    transitionSpeed: '{{ site.reveal.transitionSpeed | default: "default" }}',
    backgroundTransition: '{{ site.reveal.backgroundTransition | default: "fade" }}',

    // When printing to PDF, expand fragments onto separate pages
    pdfSeparateFragments: {{ site.reveal.pdfSeparateFragments | default: true }},

    // View mode: null (default deck), "scroll" or "print"
    {% if site.reveal.view %}view: '{{ site.reveal.view }}',{% endif %}

    // Markdown is a first-class citizen; https://revealjs.com/markdown/
    markdown: {
      smartypants: {{ site.reveal.markdown.smartypants | default: true }},
      // Convert single line breaks inside paragraphs to <br>
      breaks: {{ site.reveal.markdown.breaks | default: false }}
    },

    // Syntax highlighting; https://revealjs.com/code/
    highlight: {
      highlightOnLoad: true,
      // Show line numbers when the code block sets data-line-numbers
      escapeHTML: {{ site.reveal.highlight.escapeHTML | default: true }}
    },

    // MathJax typesetting; https://revealjs.com/math/
    math: {
      mathjax: '{{ site.reveal.math.mathjax | default: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" }}',
      config: '{{ site.reveal.math.config | default: "TeX-AMS_HTML-full" }}'
    },

    // https://revealjs.com/plugins/#built-in-plugins
    plugins: [
      RevealMarkdown,
      {% if include.highlight %}RevealHighlight,{% endif %}
      RevealSearch,
      RevealZoom,
      RevealNotes,
      RevealMath.MathJax3 || RevealMath
    ]
  });
</script>
